kind = "video"
previewPath = "/attest-coi-video/"
title = "Attest·COI Explainer Video"
version = "1.0.0"
id = "artifacts/attest-coi-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/attest-coi-video/" ]
localPort = 18161

[services.development]
run = "pnpm --filter @workspace/attest-coi-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/attest-coi-video", "run", "build" ]
publicDir = "artifacts/attest-coi-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18161"
BASE_PATH = "/attest-coi-video/"
