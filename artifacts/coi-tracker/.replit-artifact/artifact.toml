kind = "web"
previewPath = "/"
title = "Attest·COI Tracker"
version = "1.0.0"
id = "artifacts/coi-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25674

[services.development]
run = "pnpm --filter @workspace/coi-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/coi-tracker", "run", "build" ]
publicDir = "artifacts/coi-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25674"
BASE_PATH = "/"
