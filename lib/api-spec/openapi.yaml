openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: COI Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vendors
    description: Vendor operations
  - name: coi
    description: COI extraction
  - name: stats
    description: Dashboard statistics
  - name: upload-links
    description: Vendor COI self-upload links
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List all vendors
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Created vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get a single vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Not found
    put:
      operationId: updateVendor
      tags: [vendors]
      summary: Update a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Delete a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /coi/extract:
    post:
      operationId: extractCoi
      tags: [coi]
      summary: Extract COI data from a PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoiExtractInput"
      responses:
        "200":
          description: Extracted COI data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoiExtractResult"

  /vendors/{id}/upload-link:
    post:
      operationId: createUploadLink
      tags: [upload-links]
      summary: Generate a shareable COI upload link for a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Created upload link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadLink"
        "404":
          description: Vendor not found

  /upload-links/{token}:
    get:
      operationId: getUploadLink
      tags: [upload-links]
      summary: Get upload link info by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Upload link info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadLinkInfo"
        "404":
          description: Token not found or expired

  /upload-links/{token}/submit:
    post:
      operationId: submitUploadLink
      tags: [upload-links]
      summary: Submit a COI PDF via an upload link
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSubmitInput"
      responses:
        "200":
          description: Updated vendor after COI submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Token not found or expired
        "410":
          description: Link already used

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get compliance dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Coverage:
      type: object
      properties:
        type:
          type: string
        policy_number:
          type: string
        effective_date:
          type: string
        expiration_date:
          type: string
        each_occurrence:
          type: string
        aggregate:
          type: string
      required:
        - type

    Vendor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        additional_insured:
          type: boolean
        waiver_of_subrogation:
          type: boolean
        certificate_holder:
          type: string
        email:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        coverages:
          type: array
          items:
            $ref: "#/components/schemas/Coverage"
        source:
          type: ["string", "null"]
        created_at:
          type: string
      required:
        - id
        - name
        - type
        - additional_insured
        - waiver_of_subrogation
        - certificate_holder
        - coverages

    VendorInput:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        additional_insured:
          type: boolean
        waiver_of_subrogation:
          type: boolean
        certificate_holder:
          type: string
        email:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        coverages:
          type: array
          items:
            $ref: "#/components/schemas/Coverage"
        source:
          type: ["string", "null"]
      required:
        - name
        - type
        - additional_insured
        - waiver_of_subrogation
        - certificate_holder
        - coverages

    CoiExtractInput:
      type: object
      properties:
        pdf_base64:
          type: string
        vendor_type:
          type: string
      required:
        - pdf_base64
        - vendor_type

    CoiExtractResult:
      type: object
      properties:
        insured_name:
          type: string
        certificate_holder:
          type: string
        additional_insured:
          type: boolean
        waiver_of_subrogation:
          type: boolean
        coverages:
          type: array
          items:
            $ref: "#/components/schemas/Coverage"
      required:
        - insured_name
        - certificate_holder
        - additional_insured
        - waiver_of_subrogation
        - coverages

    UploadLink:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
      required:
        - token
        - expires_at

    UploadLinkInfo:
      type: object
      properties:
        vendor_id:
          type: integer
        vendor_name:
          type: string
        vendor_type:
          type: string
        expires_at:
          type: string
        used_at:
          type: ["string", "null"]
      required:
        - vendor_id
        - vendor_name
        - vendor_type
        - expires_at

    UploadSubmitInput:
      type: object
      properties:
        pdf_base64:
          type: string
      required:
        - pdf_base64

    Stats:
      type: object
      properties:
        total:
          type: integer
        compliant:
          type: integer
        expiring:
          type: integer
        non_compliant:
          type: integer
      required:
        - total
        - compliant
        - expiring
        - non_compliant
